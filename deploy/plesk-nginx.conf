# Plesk -> Domains -> oscal.neoprehn.de -> Apache & nginx-Einstellungen
# -> "Zusaetzliche nginx-Anweisungen". Dort "Proxy-Modus" ausschalten, damit nginx die
# statischen Dateien aus httpdocs direkt ausliefert.

location /api/ {
    proxy_pass http://127.0.0.1:8010;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# SPA-Fallback fuer das React-Frontend
location / {
    try_files $uri /index.html;
}
