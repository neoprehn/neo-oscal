# Plesk -> Domains -> oscal.neoprehn.de -> Apache & nginx-Einstellungen
# -> "Zusaetzliche nginx-Anweisungen". Dort "Proxy-Modus" ausschalten, damit nginx die
# statischen Dateien aus httpdocs direkt ausliefert.
#
# Kein "location /" eintragen: Plesk definiert es selbst (sonst "duplicate location").
# Sobald das Frontend Client-Routing nutzt, SPA-Fallback ueber error_page ergaenzen:
#   error_page 404 =200 /index.html;

location /api/ {
    proxy_pass http://127.0.0.1:8731;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
