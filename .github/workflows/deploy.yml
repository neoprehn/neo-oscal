name: Deploy oscal.neoprehn.de

# Laeuft nach erfolgreichem CI auf main. Standardmaessig aus: erst aktiv, wenn die
# Repository-Variable DEPLOY_ENABLED=true gesetzt ist (und die VPS_*-Secrets existieren).
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

concurrency: deploy

jobs:
  deploy:
    if: >
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      SUBDOMAIN_DIR: /var/www/vhosts/neoprehn.de/oscal.neoprehn.de
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend

      - name: SSH-Key einrichten
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Frontend hochladen
        run: |
          rsync -az --delete --exclude=.well-known --exclude=cgi-bin \
            -e "ssh -i ~/.ssh/id_deploy" \
            frontend/dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${SUBDOMAIN_DIR}/httpdocs/"

      - name: Backend aktualisieren und Dienst neu starten
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<'EOF'
          set -euo pipefail
          cd /var/www/vhosts/neoprehn.de/oscal.neoprehn.de/app
          git fetch origin main
          git reset --hard origin/main
          venv/bin/pip install -q -e backend
          venv/bin/python scripts/fetch_content.py
          systemctl restart oscal
          echo "== Deploy abgeschlossen: $(git log -1 --oneline) =="
          EOF
